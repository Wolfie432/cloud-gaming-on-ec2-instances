version: 0.2

phases:
  install:
    commands:
      - echo "Installing global AWS CDK CLI..."
      - npm install -g aws-cdk
  build:
    commands:
      - cd cdk
      - npm install
      - echo "Destroying stack CloudGamingsOnG4DN..."
      - cdk destroy CloudGamingsOnG4DN --force
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
          echo "=================================================================="
          echo "Setting deployment status as false for: $USER_EMAIL"
          echo "=================================================================="

          curl --location 'https://4ijsro6ylgqid7eqq5kywejdbq0ityue.lambda-url.ap-south-1.on.aws/api/set-ec-deployment-status' \
              --header 'Content-Type: application/json' \
              --header 'x-cyber-secret: f847e7224dccc44a6199d8e47816524d8941f6c55ec7f58da2172abdc1d1b52c' \
              --data-raw "{
                \"email\": \"$USER_EMAIL\",
                \"isProgress\": false
              }"
        fi