version: 0.2

phases:
  install:
    commands:
      - echo "Checking pre-installed Node version..."
      - node -v
      - npm -v
      - echo "Installing global AWS CDK CLI..."
      - npm install -g aws-cdk

  build:
    commands:
      - echo "Navigating to cdk directory..."
      - cd cdk

      - echo "Installing dependencies..."
      - npm install

      - echo "Bootstrapping CDK environment for Account $ACCOUNT_ID in $REGION..."
      - cdk bootstrap aws://$ACCOUNT_ID/$REGION

      - echo "Deploying stack CloudGamingsOnG4DN..."
      - cdk deploy CloudGamingsOnG4DN --require-approval never

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
          echo "=================================================================="
          echo "❌ ALERT: CDK Deployment or Build FAILED!: $USER_EMAIL"
          echo "👉 Please check the detailed error logs printed above to debug."
          echo "=================================================================="
        else
          echo "=================================================================="
          echo "✅ SUCCESS: CDK Deployment completed successfully!: $USER_EMAIL"
          echo "=================================================================="

          echo "Extracting stack outputs..."
          PUBLIC_IP=$(aws cloudformation describe-stacks --stack-name CloudGamingsOnG4DN --region ap-southeast-1 --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" --output text)
          INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name CloudGamingsOnG4DN --region ap-southeast-1 --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)

          echo "Sending instance details to backend API..."
          curl -X POST "https://4ijsro6ylgqid7eqq5kywejdbq0ityue.lambda-url.ap-south-1.on.aws/api/send-credentials" \
               -H "Content-Type: application/json" \
               -H "x-cyber-secret: f847e7224dccc44a6199d8e47816524d8941f6c55ec7f58da2172abdc1d1b52c" \
               -d "{
                 \"email\": \"$USER_EMAIL\",
                 \"publicIp\": \"$PUBLIC_IP\",
                 \"instanceId\": \"$INSTANCE_ID\",
                 \"minutes\": \"$MINUTES\"
               }"
        fi